[package]
name = "v203"
version = "0.1.0"
edition = "2024"

[features]
default = ["embassy-executor/platform-riscv32"]
platform-spin = ["embassy-executor/platform-spin"]
usart2 = []

[dependencies]
qingke-rt = "0.8.4"
qingke = "0.8.4"

ch32-hal = { 
    git = "https://github.com/ch32-rs/ch32-hal",
    version = "0.1.0",
    features = [
        "ch32v203g6u6",
        "memory-x", 
        "embassy", 
        "time-driver-tim2", 
        "rt"
    ],
    default-features = false,
}

embassy-executor = { version = "0.10.0", features = [
    "executor-thread",
] }

embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = { version = "0.5.1" }
embassy-usb-driver = "=0.2.0"
embassy-futures = { version = "0.1.2" }

embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"

# portable-atomic = { version = "1.14.0", features = ["unsafe-assume-single-core"] }
# (Need critical-section for fetch_add etc)
portable-atomic = { version = "1.14.0", features = ["critical-section"] }
ufmt = { version = "0.2.0" }
heapless = { version = "0.9.3", features = ["ufmt"] }
static_cell = "2.1.1"
critical-section = "1.2.0"
panic-halt = "1.0"

[profile.release]
opt-level = "z"        # try "s" too — sometimes wins
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 2              # free: DWARF isn't ALLOC, never reaches flash
overflow-checks = false
debug-assertions = false
incremental = false
strip = false          # keep symbols for wlink regs → dpc lookup

[profile.dev]
overflow-checks = false
